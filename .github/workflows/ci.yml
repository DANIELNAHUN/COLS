# COLS PR gate (design D6 / ci-pipeline spec).
#
# Runs on every pull_request with NO emulator and NO pre-installed Gradle:
# Gradle comes solely from the committed wrapper (project-scaffold spec: the
# wrapper is the only sanctioned entry point). The JDK pin below MUST equal
# the catalog's [versions].jvm (currently 17) — ci-pipeline spec "Workflow
# version pins trace to the version catalog". Update both together.
#
# First-party actions are pinned by full commit SHA (supply-chain guard for
# the executable-review boundary; majors fbc6f39=checkout v5 and
# b6effb0=setup-java v5 verified from their release tags on 2026-09-26).
name: pr-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: PR gate (format / lint / test / assemble)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: "Assert wrapper executable-bit integrity (threat matrix: wrapper)"
        shell: bash
        # `git ls-files -s` emits "<mode> <object> <stage>\t<path>" (e.g.
        # "100755 739907d... 0\tgradlew"). The former grep expected the path
        # directly after the mode and rejected a well-staged wrapper. Assert
        # the full tracked-entry format instead: mode exactly 100755, a
        # 40-hex object id, stage 0, and path exactly "gradlew".
        run: |
          mode="$(git ls-files -s gradlew)"
          echo "staged mode: $mode"
          printf '%s\n' "$mode" | awk '
            {
              seen = 1
              ok = 1
              n = split($0, f, "\t")
              if (n != 2 || f[1] !~ /^100755 [0-9a-f]{40} 0$/ || f[2] != "gradlew") ok = 0
            }
            END { if (!seen || !ok) exit 1 }' || {
            echo '::error::gradlew lost its executable bit (expected a tracked entry "100755 <sha> 0<TAB>gradlew" from git ls-files -s); fix with: git update-index --chmod=+x gradlew'
            exit 1
          }

      - name: Validate Gradle wrapper JAR checksums
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up JDK 17 (temurin — matches catalog `jvm = "17"`)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Provision Android SDK in-job (no runner state relied on)
        # sdkmanager is NOT preinstalled on hosted runners: fetch the
        # command-line tools ourselves, then install only the components this
        # project pins (platform-tools, android-37.0, build-tools 36.0.0).
        shell: bash
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          # The official current Linux commandlinetools archive (published on
          # developer.android.com/studio?pkg=tools, SHA-256 as published on
          # that page). The old -13114788-update.zip filename returns HTTP 404
          # (hosted PR run 36292331819, downloaded with -f so the bogus HTML
          # was rejected before unzip itself failed).
          toolsUrl="https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          curl -fsSL -A "COLS-CI" -o "$RUNNER_TEMP/cmdline-tools.zip" "$toolsUrl"
          [ -s "$RUNNER_TEMP/cmdline-tools.zip" ] || { echo '::error::cmdline-tools download failed'; exit 1; }
          # Integrity check against the SHA-256 published on the same official
          # download page; blank output on failure so a parse error means fail.
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  ${RUNNER_TEMP}/cmdline-tools.zip" \
            | (cd / && sha256sum -c -)
          # unzip does not create intermediate directories: hosted PR run
          # 36292663587 failed with "cannot create extraction directory"
          # because $ANDROID_HOME/cmdline-tools did not exist yet.
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager" --licenses > /dev/null
          # Android 37's stable package is minor-versioned (android-37.0); the
          # literal "platforms;android-37" never existed in the repository
          # (sdkmanager evidence from hosted run 36292331819).
          "$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Spotless/ktlint check (cheapest gate — fails first)
        run: ./gradlew spotlessCheck

      - name: Android Lint (`:app:lintDebug` — API-level misuse gate)
        run: ./gradlew :app:lintDebug

      - name: Unit tests (`:app:testDebugUnitTest` — workspace test command)
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK (`:app:assembleDebug`)
        run: ./gradlew :app:assembleDebug
