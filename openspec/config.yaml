# SDD project configuration — initialized by sdd-init (hybrid persistence)
schema: spec-driven

context: |
  Project: COLS — "Calls-only" Android launcher for senior users.
  Stack (refreshed 2026-09-26 by sdd-init re-run): Android, single Gradle
  module `:app` at the workspace root — Kotlin via AGP 9.2.1 built-in KGP,
  Jetpack Compose + Material 3, compileSdk 37 / targetSdk 36 / minSdk 26,
  JDK 17, Gradle 9.4.1 via the committed wrapper (the only build entry point).
  Packages: ui/ (Compose), domain/ (agent seam ports + confirmation rule),
  data/ (in-memory adapters). Quality gates: Spotless/ktlint, lintDebug,
  Kover domain >=80% line.
  Primary product constraint: elderly-user UX (large touch targets, high
  contrast, simplified navigation, call-centric flows).

strict_tdd: true
strict_tdd_reason: >-
  Re-run after the bootstrap-android-launcher scaffold: exactly one in-scope
  project root (Gradle build at the workspace root) and an explicit
  workspace-level test command (`./gradlew :app:testDebugUnitTest`) covers it,
  so the workspace-wide-command gate resolves to Strict TDD enabled.

testing:
  projects:
    - path: "."
      stack: Android (Kotlin + Compose, AGP 9.2.1, Gradle 9.4.1 wrapper, JDK 17)
      test_command: ./gradlew :app:testDebugUnitTest
      framework: JUnit4 (+ Robolectric 4.16.1 and Compose test runtime for
        framework/UI-layer tests; no emulator)
  workspace_test_command: ./gradlew :app:testDebugUnitTest
  layers:
    unit_jvm: ./gradlew :app:testDebugUnitTest # pure JVM domain tests + Robolectric + Compose tests
    instrumented: deferred to the telephony change (TS-01); no device/emulator in the bootstrap loop
  coverage: ./gradlew :app:koverVerify # domain package only, >=80% line floor; reports via koverHtmlReport/koverXmlReport
  lint: ./gradlew :app:lintDebug
  format_check: ./gradlew spotlessCheck
  format_apply: ./gradlew spotlessApply
  notes: >-
    Detected 2026-09-26 by the sdd-init re-run. The workspace test command is
    zero-exit-code on a green suite and identifies failing tests by name, so it
    is CI-suitable (enforced in .github/workflows/ci.yml).

rules:
  proposal:
    - Include rollback plan for risky changes
    - State explicitly when a change depends on project bootstrap (toolchain/scaffold)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Accessibility for senior users is a testable requirement, not a nice-to-have
  design:
    - Document architecture decisions with rationale (ADR style)
    - Cover toolchain bootstrap (JDK, Android SDK, Gradle wrapper) before app architecture
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns once a codebase exists
    tdd: true
    test_command: "./gradlew :app:testDebugUnitTest"
  verify:
    test_command: "./gradlew :app:testDebugUnitTest :app:koverVerify spotlessCheck"
    build_command: "./gradlew :app:assembleDebug"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
